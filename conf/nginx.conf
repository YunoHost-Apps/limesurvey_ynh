# Main location
location __PATH__/ {
    alias __INSTALL_DIR__/;
    index index.php index.html;
    client_max_body_size 50M;
    more_set_headers "X-Frame-Options : ALLOWALL";

    try_files $uri $uri/ @limesurvey;

    location ~ [^/]\.php(/|$) {
        fastcgi_split_path_info ^__PATH__(/.+\.php)(.*)$;
        include fastcgi_params_with_auth;
        fastcgi_param SCRIPT_FILENAME __INSTALL_DIR__$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_pass unix:/var/run/php/php__PHP_VERSION__-fpm-__APP__.sock;
    }
}

location @limesurvey {
  rewrite ^__PATH__/(.*)$ __PATH__/index.php/$1 last;
}

# Limesurvey security rules proposed in example
location ~ ^__PATH__/\.(?!well-known).* { deny all; }
location ~ ^__PATH__/tmp/runtime/ { deny all; }
location ~* ^__PATH__/(application|protected|modules|locale|framework|vendor|tests|docs|db)/ { deny all; }
location ~* ^__PATH__/.*\.(log|sql|htaccess)$ { deny all; }
location ~* ^__PATH__/upload/.*\.(pl|cgi|py|pyc|pyo|phtml|sh|lua|php|php3|php4|php5|php6|pcgi|pcgi3|pcgi4|pcgi5|pcgi6|icn)$ { return 444; }
location ~ ^__PATH__/upload/surveys/.*/fu_[a-z0-9]*$ { return 444; }
